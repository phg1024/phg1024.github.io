<!doctype html>
<html lang="en">
     <head>
         <meta charset="utf-8">
         <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
         <script>
             (function () {
                var savedTheme = localStorage.getItem('site-theme') || 'cyberpunk';
                document.documentElement.setAttribute('data-theme', savedTheme);
             })();
         </script>
         <link rel="preconnect" href="https://fonts.googleapis.com">
         <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
         <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
         <title>Ray Tracer | Peihong Guo</title>
         <link rel="stylesheet" href="/styles/styles.css">
         <link rel="stylesheet" href="./style.css">
     </head>
     <body>
         <canvas class="theme-backdrop" aria-hidden="true"></canvas>
         <canvas class="pointer-reactive-overlay" aria-hidden="true"></canvas>
         <div class="site-shell">
             <header class="site-header">
                 <div class="site-header__inner">
                     <a class="site-brand" href="/">
                         <span class="site-brand__name">Peihong Guo</span>
                     </a>
                     <nav class="site-nav" aria-label="Primary navigation">
                         <a class="site-nav__link" href="/">Home</a>
                         <a class="site-nav__link is-active" href="/project/personal_projects/">Projects</a>
                         <a class="site-nav__link" href="/blog/">Blog</a>
                         <a class="site-nav__link" href="/gallery">Gallery</a>
                         <a class="site-nav__link" href="/about">About</a>
                     </nav>
                 </div>
             </header>

             <main class="site-main" role="main">
                 <section class="content-page project-page">
                     <div class="section-heading">
                         <p class="section-heading__eyebrow">Interactive Project</p>
                         <h1 class="section-heading__title">JavaScript Ray Tracer</h1>
                     </div>

                     <div class="project-app-shell">
                         <p class="project-app-intro">
                            Render a scene in the browser with configurable resolution, sampling, depth, and worker count.
                         </p>

                         <div class="project-canvas-frame">
                             <canvas id="canvas" width="480" height="320"></canvas>
                             <div id="projectionMarker" class="project-projection-marker" hidden>
                                 <span class="project-projection-marker__dot" aria-hidden="true"></span>
                                 <span class="project-projection-marker__label">Under sphere</span>
                             </div>
                             <div id="fpsCounter" class="project-fps-counter" aria-live="polite">FPS: --</div>
                         </div>

                         <div class="project-controls-grid">
                             <label class="project-field project-field--compact"><span>Width <input id="width" type="text" value="480" class="project-field__inline" inputmode="numeric"></span></label>
                             <label class="project-field project-field--compact"><span>Height <input id="height" type="text" value="320" class="project-field__inline" inputmode="numeric"></span></label>
                             <label class="project-field project-field--compact"><span>Samples <input id="nsamples" type="text" value="1" class="project-field__inline" inputmode="numeric"></span></label>
                             <label class="project-field project-field--compact"><span>Max Depth <input id="maxdepth" type="text" value="8" class="project-field__inline" inputmode="numeric"></span></label>
                             <label class="project-field project-field--compact"><span>Threads <input id="threads" type="text" value="8" class="project-field__inline" inputmode="numeric"></span></label>
                          </div>

                         <div class="project-controls-secondary">
                             <label class="project-field project-field--compact">
                                 <span>Scene <select id="scene" class="project-field__inline project-field__inline--select"></select></span>
                             </label>
                             <label class="project-field project-field--compact">
                                 <span>Backend <select id="backend" class="project-field__inline project-field__inline--select">
                                     <option value="cpu">CPU Workers</option>
                                     <option value="webgpu" selected>WebGPU</option>
                                 </select></span>
                             </label>
                             <label class="project-field project-field--compact">
                                 <span>Use BVH <input type="checkbox" id="bvhToggle" class="project-field__toggle" checked></span>
                             </label>
                             <label class="project-field project-field--compact">
                                 <span>Path Trace <input type="checkbox" id="pathTraceToggle" class="project-field__toggle" checked></span>
                             </label>
                             <label class="project-field project-field--compact">
                                 <span>Tracer <select id="tracerMode" class="project-field__inline project-field__inline--select">
                                     <option value="path" selected>Path Tracer</option>
                                 </select></span>
                             </label>
                             <label class="project-field project-field--compact">
                                 <span>Caustic Only <input type="checkbox" id="causticOnlyToggle" class="project-field__toggle"></span>
                             </label>
                             <div class="project-actions">
                                 <button id="renderButton" class="project-button" type="button" onclick="render()">Render</button>
                                 <button id="saveButton" class="project-button project-button--secondary" type="button" onclick="saveImage()">Save</button>
                                 <button id="resizeButton" class="project-button project-button--secondary" type="button" onclick="resize()">Resize</button>
                             </div>
                          </div>
                         </div>

                         <div class="project-progress-shell" aria-live="polite">
                             <div class="project-progress-bar">
                                 <div id="pbar" class="project-progress-fill" style="width: 0%;">
                                     <span id="pbarvalue">0% Complete</span>
                                 </div>
                             </div>
                             <p id="progress" class="project-progress-text"></p>
                         </div>
                     </div>
                 </section>
             </main>

             <footer class="site-footer">
                 <div class="site-footer__inner">
                     <p class="site-footer__copy">&copy; 2009-<script>document.write(new Date().getFullYear());</script> Peihong Guo</p>
                     <label class="theme-toggle" for="theme-toggle">
                         <span class="theme-toggle__label">Theme</span>
                         <select class="theme-toggle__select" id="theme-toggle" aria-label="Choose theme">
                             <option value="minimalist">Minimalist</option>
                             <option value="cyberpunk">Cyberpunk</option>
                             <option value="matrix">Matrix</option>
                             <option value="industrial">Industrial</option>
                             <option value="win31">Windows 3.1</option>
                         </select>
                     </label>
                     <a class="site-footer__link" href="mailto:admin@phg1024.net">admin@phg1024.net</a>
                 </div>
             </footer>
         </div>

         <script type="text/javascript" src="FileSaver.js"></script>
         <script type="text/javascript" src="canvas-toBlob.js"></script>
         <script type="module" src="main.js"></script>
         <script src="/js/main.js"></script>
     </body>
</html>
