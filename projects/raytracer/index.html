    <body>
        <canvas class="theme-backdrop" aria-hidden="true"></canvas>
        <canvas class="pointer-reactive-overlay" aria-hidden="true"></canvas>
        <div class="site-shell">
            <header class="site-header">
                <div class="site-header__inner">
                    <a class="site-brand" href="/">
                        <span class="site-brand__name">Peihong Guo</span>
                    </a>
                    <nav class="site-nav" aria-label="Primary navigation">
                        <a class="site-nav__link" href="/">Home</a>
                        <a class="site-nav__link is-active" href="/project/personal_projects/">Projects</a>
                        <a class="site-nav__link" href="/blog/">Blog</a>
                        <a class="site-nav__link" href="/gallery">Gallery</a>
                        <a class="site-nav__link" href="/about">About</a>
                    </nav>
                </div>
            </header>

            <main class="site-main" role="main">
                <section class="content-page project-page">
                    <div class="section-heading">
                        <p class="section-heading__eyebrow">Interactive Project</p>
                        <h1 class="section-heading__title">JavaScript Ray Tracer</h1>
                    </div>

                    <div class="project-app-shell">
                        <p class="project-app-intro">
                            Render a scene in the browser with configurable resolution, sampling, depth, and worker count.
                        </p>

                        <div class="project-canvas-frame">
                            <canvas id="canvas" width="480" height="320"></canvas>
                        </div>

                        <div class="project-controls-grid">
                            <label class="project-field project-field--compact">
                                <span>Width</span>
                                <input id="width" type="text" value="480" inputmode="numeric">
                            </label>
                            <label class="project-field project-field--compact">
                                <span>Height</span>
                                <input id="height" type="text" value="320" inputmode="numeric">
                            </label>
                            <label class="project-field project-field--compact">
                                <span>Samples</span>
                                <input id="nsamples" type="text" value="4" inputmode="numeric">
                            </label>
                            <label class="project-field project-field--compact">
                                <span>Max Depth</span>
                                <input id="maxdepth" type="text" value="8" inputmode="numeric">
                            </label>
                            <label class="project-field project-field--compact">
                                <span>Threads</span>
                                <input id="threads" type="text" value="8" inputmode="numeric">
                            </label>
                        </div>

                        <div class="project-actions">
                            <button id="renderButton" class="project-button" type="button" onclick="render()">Render</button>
                            <button id="saveButton" class="project-button project-button--secondary" type="button" onclick="saveImage()">Save</button>
                            <button id="resizeButton" class="project-button project-button--secondary" type="button" onclick="resize()">Resize</button>
                        </div>

                        <div class="project-progress-shell" aria-live="polite">
                            <div class="project-progress-bar">
                                <div id="pbar" class="project-progress-fill" style="width: 0%;">
                                    <span id="pbarvalue">0% Complete</span>
                                </div>
                            </div>
                            <p id="progress" class="project-progress-text"></p>
                        </div>
                    </div>
                </section>
            </main>

            <footer class="site-footer">

                    <p class="site-footer__copy">&copy; 2009-<script>document.write(new Date().getFullYear());</script> Peihong Guo</p>

                    </label>
                    <a class="site-footer__link" href="mailto:admin@phg1024.net">admin@phg1024.net</a>
                </div>

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script type="text/javascript" src="shape.js"></script>
        <script type="text/javascript" src="image.js"></script>
        <script type="text/javascript" src="utils.js"></script>
        <script type="text/javascript" src="point.js"></script>
        <script type="text/javascript" src="vector.js"></script>
        <script type="text/javascript" src="mesh.js"></script>
        <script type="text/javascript" src="raytracer.js"></script>
        <script type="text/javascript" src="FileSaver.js"></script>
        <script type="text/javascript" src="canvas-toBlob.js"></script>
        <script type="text/javascript">
            function resize() {
                var w = document.getElementById('width').value;
                var h = document.getElementById('height').value;
                canvas.setAttribute('width', w);
                canvas.setAttribute('height', h);
            }

            var canvas;
            var ctx;
            var finishedCount;
            var startT, endT;
            var progress;

            function init() {
                canvas = document.getElementById('canvas');
                ctx = canvas.getContext('2d');
            }

            function render() {
                $('#pbar').width(0 + '%');
                startT = new Date();

                var w = canvas.width;
                var h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                var nsamples = document.getElementById('nsamples').value;
                var maxDepth = document.getElementById('maxdepth').value;
                var nthreads = document.getElementById('threads').value;
                finishedCount = 0;

                var nextTask = 0;
                var blockSizeX = 32, blockSizeY = 32;
                var ntasksX = Math.ceil(w / blockSizeX);
                var ntasksY = Math.ceil(h / blockSizeY);
                var ntasks = ntasksX * ntasksY;

                var tasks = [];

                var y1 = 0, y2 = blockSizeY;
                for (var i = 0; i < ntasksY; i++) {
                    var x1 = 0, x2 = blockSizeX;
                    for (var j = 0; j < ntasksX; j++) {
                        var task = { x1: x1, x2: x2, y1: y1, y2: y2 };
                        tasks.push(task);

                        x1 = x1 + blockSizeX;
                        x2 = (j == ntasksX - 1) ? w : x2 + blockSizeX;
                    }
                    y1 = y1 + blockSizeY;
                    y2 = (i == ntasksY - 1) ? h : y2 + blockSizeY;
                }

                progress = [];
                var workers = [];
                for (var tid = 0; tid < nthreads; tid++) {
                    var worker = new Worker('renderWorker.js');
                    worker.idx = tid;
                    worker.onmessage = function (e) {
                        var data = e.data;
                        switch (data.msg) {
                            case 'progress':
                                progress[data.tidx] = data.value;
                                document.getElementById("progress").innerHTML = 'Rendering in progress: ' + progress.mean().toFixed(2) + '%';
                                break;
                            case 'image':
                                updateCanvas(data.x1, data.x2, data.y1, data.y2, data.value);
                                finishedCount++;

                                $('#pbar').width((finishedCount / ntasks * 100.0).toFixed(2) + '%');
                                $('#pbarvalue').html((finishedCount / ntasks * 100.0).toFixed(2) + '% Completed');

                                if (nextTask < ntasks) {
                                    var task = tasks[nextTask];
                                    nextTask = nextTask + 1;

                                    this.postMessage({
                                        cmd: 'start', tidx: this.idx, w: w, h: h,
                                        x1: task.x1, x2: task.x2, y1: task.y1, y2: task.y2,
                                        nsamples: nsamples, maxDepth: maxDepth
                                    });
                                } else {
                                    endT = new Date();
                                    var diff = endT - startT;
                                    document.getElementById("progress").innerHTML = 'Finished in ' + diff + ' ms.';
                                }

                                break;
                        }
                    };
                    workers.push(worker);
                    progress.push(0);
                }

                for (var index = 0; index < nthreads; index++) {
                    var seedTask = tasks[nextTask];
                    nextTask = nextTask + 1;
                    workers[index].postMessage({
                        cmd: 'start', tidx: index, w: w, h: h,
                        x1: seedTask.x1, x2: seedTask.x2, y1: seedTask.y1, y2: seedTask.y2,
                        nsamples: nsamples, maxDepth: maxDepth
                    });
                }
            }

            function updateCanvas(x1, x2, y1, y2, buffer) {
                var w = canvas.width;
                var h = canvas.height;

                var img = new RGBAImage(0, 0);
                img.w = x2 - x1;
                img.h = y2 - y1;
                img.data = new Uint8Array(buffer);
                ctx.putImageData(img.toImageData(ctx), x1, h - y2, 0, 0, img.w, img.h);
            }

            function saveImage() {
                canvas.toBlob(function (blob) {
                    saveAs(blob, "renderedImage.png");
                });
            }

            window.onload = init;
        </script>
        <script src="/js/main.js"></script>
    </body>
</html>
