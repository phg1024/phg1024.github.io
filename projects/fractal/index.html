         <script id="shader-fs" type="x-shader/x-fragment">
    precision mediump float;
    uniform vec2 viewport;
    uniform vec2 c;
    uniform vec3 c1, c2, c3, c4;
    uniform int iters;
    uniform int setIdx;
    uniform float THRES;

    vec2 mul(vec2 z1, vec2 z2) {
        return vec2(z1.x*z2.x-z1.y*z2.y,z1.x*z2.y+z1.y*z2.x);
     }

    float mag(vec2 z) {
        return z.x*z.x+z.y*z.y;
     }

    int julia_iteration(vec2 inz) {
        vec2 z = inz;
        vec2 cval;
        if( setIdx == 0 ) cval = c;
        else cval = inz;

        float val = mag(z);
        int counter = 0;
        const int maxiters = 32767;
        for(int i=0; i<maxiters; i++) {
            z = mul(z, z) + cval;
            val = mag(z);
            if( val >= THRES || i > iters ) break;
            counter++;
         }

        return counter;
     }

    vec4 iterpolate(int i) {
        float t = float(i) / float(iters);
        t = pow(t, 0.25);
        vec3 color;
        if( t >= 0.75 )
            color = mix(c1, c2, pow((t - 0.75) / 0.25, 1.0));
        else if( t >= 0.5 )
            color = mix(c2, c3, pow((t - 0.5) / 0.25, 0.25));
        else
            color = mix(c3, c4, pow(t / 0.5, 2.0));

        return vec4(color, 1.0);
     }

    void main(void) {
        vec2 coord = gl_FragCoord.xy;
        float x = (coord.x - viewport.x*0.5) * 3.5 / viewport.x;
        float y = (coord.y - viewport.y*0.5) * 3.5 / viewport.y;
        int its = julia_iteration(vec2(x, y));
        gl_FragColor = iterpolate(its);
     }
         </script>

         <script id="shader-vs" type="x-shader/x-vertex">
    attribute vec2 aVertex;

    uniform mat4 uMVMatrix;
    uniform mat4 uPMatrix;
    void main(void) {
        gl_Position = uPMatrix * uMVMatrix * vec4(aVertex, 0.0, 1.0);
     }
         </script>

         <script type="text/javascript">
            document.getElementById('footer-year').textContent = new Date().getFullYear();
            var gl;
            function initGL(canvas) {
                try {
                    // Fixed legacy API usage
                    gl = canvas.getContext("webgl");
                    gl.viewportWidth = canvas.width;
                    gl.viewportHeight = canvas.height;
                  } catch (e) {
                  }
                if (!gl) {
                    alert("Could not initialise WebGL, sorry :-(");
                }
            }

            function getShader(gl, id) {
                var shaderScript = document.getElementById(id);
                if (!shaderScript) {
                    return null;
                }

                var str = "";
                var k = shaderScript.firstChild;
                while (k) {
                    if (k.nodeType == 3) {
                        str += k.textContent;
                    }
                    k = k.nextSibling;
                }

                var shader;
                if (shaderScript.type == "x-shader/x-fragment") {
                    shader = gl.createShader(gl.FRAGMENT_SHADER);
                } else if (shaderScript.type == "x-shader/x-vertex") {
                    shader = gl.createShader(gl.VERTEX_SHADER);
                } else {
                    return null;
                }

                gl.shaderSource(shader, str);
                gl.compileShader(shader);

                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    alert(gl.getShaderInfoLog(shader));
                    return null;
                }

                return shader;
            }

            var shaderProgram;

            function initShaders() {
                var vertexShader = getShader(gl, "shader-vs");
                var fragmentShader = getShader(gl, "shader-fs");

                shaderProgram = gl.createProgram();
                gl.attachShader(shaderProgram, vertexShader);
                gl.attachShader(shaderProgram, fragmentShader);
                gl.linkProgram(shaderProgram);

                if (!gl.getProgramParameter(shaderProgram, gl.LINK_STATUS)) {
                    alert("Could not initialise shaders");
                }

                gl.useProgram(shaderProgram);

                shaderProgram.pMatrixUniform = gl.getUniformLocation(shaderProgram, "uPMatrix");
                shaderProgram.mvMatrixUniform = gl.getUniformLocation(shaderProgram, "uMVMatrix");

                shaderProgram.viewport = gl.getUniformLocation(shaderProgram, 'viewport');
                shaderProgram.c = gl.getUniformLocation(shaderProgram, 'c');

                shaderProgram.iters = gl.getUniformLocation(shaderProgram, 'iters');
                shaderProgram.setIdx = gl.getUniformLocation(shaderProgram, 'setIdx');
                shaderProgram.thres = gl.getUniformLocation(shaderProgram, 'THRES');

                shaderProgram.c1 = gl.getUniformLocation(shaderProgram, 'c1');
                shaderProgram.c2 = gl.getUniformLocation(shaderProgram, 'c2');
                shaderProgram.c3 = gl.getUniformLocation(shaderProgram, 'c3');
                shaderProgram.c4 = gl.getUniformLocation(shaderProgram, 'c4');

                vloc = gl.getAttribLocation(shaderProgram, 'aVertex');
            }

            var mvMatrix = mat4.create();
            var pMatrix = mat4.create();

            function setMatrixUniforms() {
                gl.uniformMatrix4fv(shaderProgram.pMatrixUniform, false, pMatrix);
                gl.uniformMatrix4fv(shaderProgram.mvMatrixUniform, false, mvMatrix);
            }

            var vertexBuffer;
            var vloc;

            function initBuffers() {
                vertexBuffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
                var vertices = [
                    -1.0,   1.0,   -2.0,
                    -1.0,   -1.0,   -2.0,
                     1.0, -1.0,   -2.0,
                     1.0,  1.0,   -2.0
                ];
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
            }

            function drawScene() {
                gl.viewport(0, 0, gl.viewportWidth, gl.viewportHeight);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                mat4.ortho(pMatrix, -1.0, 1.0, -1.0, 1.0, 0.1, 100.0);
                mat4.identity(mvMatrix);
                mat4.translate(mvMatrix, mvMatrix, [0.0, 0.0, -7.0]);

                setMatrixUniforms();

                gl.uniform2f(shaderProgram.viewport, gl.viewportWidth, gl.viewportHeight);

                // Replaced jQuery selectors with vanilla JS
                gl.uniform2f(shaderProgram.c, parseFloat(document.getElementById('cvalr').value), parseFloat(document.getElementById('cvali').value));
                gl.uniform1i(shaderProgram.iters, parseInt(document.getElementById('maxiters').value, 10));
                gl.uniform1i(shaderProgram.setIdx, parseInt(document.getElementById('fractalSelect').value, 10));
                gl.uniform1f(shaderProgram.thres, parseFloat(document.getElementById('blackout').value));

                gl.uniform3f(shaderProgram.c1, 0, 0.0, 0);
                gl.uniform3f(shaderProgram.c2, 0.05, 0.10, 0.05);
                gl.uniform3f(shaderProgram.c3, 0.075, 0.15, 0.175);
                gl.uniform3f(shaderProgram.c4, 0.65, 0.75, 1.0);

                gl.enableVertexAttribArray(vloc);
                gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
                gl.vertexAttribPointer(vloc, 3, gl.FLOAT, false, 0, 0);

                gl.drawArrays(gl.TRIANGLE_FAN, 0, 4);
            }

            function webGLStart() {
                var canvas = document.getElementById("lesson01-canvas");
                initGL(canvas);
                initShaders();
                initBuffers();

                gl.clearColor(0.0, 0.0, 0.0, 1.0);
                gl.enable(gl.DEPTH_TEST);

                drawScene();
            }

            function saveImage() {
                var canvas = document.getElementById("lesson01-canvas");
                // Replaced FileSaver.js with native canvas.toBlob
                canvas.toBlob(function(blob) {
                    if (!blob) {
                        alert("Canvas is empty or failed to export.");
                        return;
                    }
                    var url = URL.createObjectURL(blob);
                    var link = document.createElement("a");
                    link.href = url;
                    link.download = "fractal.png";
                    link.click();
                    URL.revokeObjectURL(url);
                }, "image/png");
            }

            window.onload = function () {
                webGLStart();

                // Update output displays and redraw on slider change
                function updateSlider(id, valId, fmt) {
                    var slider = document.getElementById(id);
                    var output = document.getElementById(valId);
                    slider.addEventListener('input', function() {
                        output.textContent = fmt(parseFloat(slider.value));
                        drawScene();
                    });
                }
                updateSlider('cvalr', 'cvalr-val', function(v) { return v.toFixed(3); });
                updateSlider('cvali', 'cvali-val', function(v) { return v.toFixed(3); });
                updateSlider('maxiters', 'maxiters-val', function(v) { return Math.round(v).toString(); });
                updateSlider('blackout', 'blackout-val', function(v) { return Math.round(v).toString(); });

                document.getElementById('fractalSelect').addEventListener('change', drawScene);
            };
         </script>
