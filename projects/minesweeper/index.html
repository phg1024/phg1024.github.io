<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <script>
            (function () {
                var savedTheme = localStorage.getItem('site-theme') || 'cyberpunk';
                document.documentElement.setAttribute('data-theme', savedTheme);
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
        <title>MineSweeper | Peihong Guo</title>
        <link rel="stylesheet" href="/styles/styles.css">
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <canvas class="theme-backdrop" aria-hidden="true"></canvas>
        <canvas class="pointer-reactive-overlay" aria-hidden="true"></canvas>
        <div class="site-shell">
            <header class="site-header">
                <div class="site-header__inner">
                    <a class="site-brand" href="/">
                        <span class="site-brand__name">Peihong Guo</span>
                    </a>
                    <nav class="site-nav" aria-label="Primary navigation">
                        <a class="site-nav__link" href="/">Home</a>
                        <a class="site-nav__link is-active" href="/project/personal_projects/">Projects</a>
                        <a class="site-nav__link" href="/blog/">Blog</a>
                        <a class="site-nav__link" href="/gallery">Gallery</a>
                        <a class="site-nav__link" href="/about">About</a>
                    </nav>
                </div>
            </header>

            <main class="site-main" role="main">
                <section class="content-page project-page minesweeper-page">
                    <div class="section-heading">
                        <p class="section-heading__eyebrow">Interactive Project</p>
                        <h1 class="section-heading__title">MineSweeper</h1>
                    </div>
                    <div class="project-app-shell minesweeper-shell">
                        <p class="project-app-intro minesweeper-intro">
                            A browser-based Minesweeper board with adjustable size and bomb count.
                        </p>
                        <div class="project-controls-grid minesweeper-controls">
                            <button id="initButton" type="button" class="project-button">Initialize</button>
                            <button id="revealButton" type="button" class="project-button project-button--secondary">Reveal</button>
                            <label class="project-field minesweeper-field">
                                <span>Size</span>
                                <input id="fieldsize" type="text" value="10" inputmode="numeric">
                            </label>
                            <label class="project-field minesweeper-field">
                                <span>Bombs</span>
                                <input id="bombs" type="text" value="8" inputmode="numeric">
                            </label>
                        </div>
                        <div id="board" class="minesweeper-board" aria-label="MineSweeper board"></div>
                    </div>
                </section>
            </main>

            <footer class="site-footer">
                <div class="site-footer__inner">
                    <p class="site-footer__copy">&copy; 2009-<script>document.write(new Date().getFullYear());</script> Peihong Guo</p>
                    <label class="theme-toggle" for="theme-toggle">
                        <span class="theme-toggle__label">Theme</span>
                        <select class="theme-toggle__select" id="theme-toggle" aria-label="Choose theme">
                            <option value="minimalist">Minimalist</option>
                            <option value="cyberpunk">Cyberpunk</option>
                            <option value="matrix">Matrix</option>
                            <option value="industrial">Industrial</option>
                            <option value="win31">Windows 3.1</option>
                        </select>
                    </label>
                    <a class="site-footer__link" href="mailto:admin@phg1024.net">admin@phg1024.net</a>
                </div>
            </footer>
        </div>

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
        <script src="minesweeper.js"></script>
        <script src="/js/main.js"></script>
    </body>
</html>
