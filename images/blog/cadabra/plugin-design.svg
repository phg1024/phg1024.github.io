<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#3b4457"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#c24a4a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#1f9d6b"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#f7f8fb"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1e2433">Cadabra listens, the plugin does the rest</text>
  <text x="450" y="55" text-anchor="middle" font-size="12.5" fill="#5b6478">What crosses each line, and what it takes for anything to leave the Mac</text>

  <!-- the Mac -->
  <rect x="20" y="70" width="626" height="330" rx="12" fill="#eef2fa" stroke="#9fb0d0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="34" y="89" font-size="12" font-weight="600" fill="#2f4a7a">This Mac</text>

  <!-- Cadabra -->
  <rect x="40" y="98" width="220" height="290" rx="10" fill="#ffffff" stroke="#c9d2e3" stroke-width="1.5"/>
  <text x="150" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1e2433">Cadabra</text>
  <text x="150" y="138" text-anchor="middle" font-size="11.5" fill="#5b6478">public app · its one job is listening</text>

  <rect x="52" y="150" width="196" height="50" rx="8" fill="#f7f8fb" stroke="#d8dfeb"/>
  <text x="150" y="171" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Agent key</text>
  <text x="150" y="189" text-anchor="middle" font-size="11.5" fill="#5b6478">record while it's held</text>

  <rect x="52" y="210" width="196" height="50" rx="8" fill="#f7f8fb" stroke="#d8dfeb"/>
  <text x="150" y="231" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Recognize, on the Mac</text>
  <text x="150" y="249" text-anchor="middle" font-size="11.5" fill="#5b6478">SenseVoice, my words favored</text>

  <rect x="52" y="270" width="196" height="50" rx="8" fill="#f7f8fb" stroke="#d8dfeb"/>
  <text x="150" y="291" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Window for the page</text>
  <text x="150" y="309" text-anchor="middle" font-size="11.5" fill="#5b6478">borderless, a web view</text>

  <rect x="52" y="330" width="196" height="50" rx="8" fill="#fdeeee" stroke="#e5b3b3"/>
  <text x="150" y="351" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Fences</text>
  <text x="150" y="369" text-anchor="middle" font-size="11.5" fill="#5b6478">own folder, listed hosts only</text>

  <!-- events: Cadabra -> page -->
  <text x="330" y="152" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e2433">events</text>
  <text x="330" y="166" text-anchor="middle" font-size="10.5" fill="#5b6478">listen, partial,</text>
  <text x="330" y="179" text-anchor="middle" font-size="10.5" fill="#5b6478">final, level, cancel</text>
  <line x1="262" y1="190" x2="396" y2="190" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- bridge: page -> Cadabra -->
  <text x="330" y="234" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e2433">bridge</text>
  <text x="330" y="248" text-anchor="middle" font-size="10.5" fill="#5b6478">close, resize,</text>
  <text x="330" y="261" text-anchor="middle" font-size="10.5" fill="#5b6478">copy, storage</text>
  <line x1="398" y1="272" x2="264" y2="272" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- what the plugin is not told -->
  <text x="330" y="322" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a3a3a">never passed on</text>
  <text x="330" y="336" text-anchor="middle" font-size="10.5" fill="#5b6478">the app I was in,</text>
  <text x="330" y="349" text-anchor="middle" font-size="10.5" fill="#5b6478">the text there,</text>
  <text x="330" y="362" text-anchor="middle" font-size="10.5" fill="#5b6478">ordinary dictation,</text>
  <text x="330" y="375" text-anchor="middle" font-size="10.5" fill="#5b6478">my vocabulary</text>

  <!-- Plugin -->
  <rect x="400" y="98" width="226" height="290" rx="10" fill="#fff8e6" stroke="#e0c675" stroke-width="1.5"/>
  <text x="513" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1e2433">Plugin</text>
  <text x="513" y="138" text-anchor="middle" font-size="11.5" fill="#5b6478">a folder: plugin.json + a web page</text>

  <rect x="414" y="150" width="198" height="50" rx="8" fill="#ffffff" stroke="#ecd9a2"/>
  <text x="513" y="171" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Confirm</text>
  <text x="513" y="189" text-anchor="middle" font-size="11.5" fill="#5b6478">Return before anything is sent</text>

  <rect x="414" y="210" width="198" height="50" rx="8" fill="#ffffff" stroke="#ecd9a2"/>
  <text x="513" y="231" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Call the agent</text>
  <text x="513" y="249" text-anchor="middle" font-size="11.5" fill="#5b6478">its own requests, its own token</text>

  <rect x="414" y="270" width="198" height="50" rx="8" fill="#ffffff" stroke="#ecd9a2"/>
  <text x="513" y="291" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Show the reply</text>
  <text x="513" y="309" text-anchor="middle" font-size="11.5" fill="#5b6478">Markdown, pictures, follow-ups</text>

  <rect x="414" y="330" width="198" height="50" rx="8" fill="#ffffff" stroke="#ecd9a2"/>
  <text x="513" y="351" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Look and voice</text>
  <text x="513" y="369" text-anchor="middle" font-size="11.5" fill="#5b6478">the flame, reading aloud</text>

  <!-- out to the agent -->
  <line x1="612" y1="235" x2="700" y2="190" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="704" y="150" width="176" height="76" rx="10" fill="#ffffff" stroke="#c9d2e3" stroke-width="1.5"/>
  <text x="792" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#1e2433">Jarvis</text>
  <text x="792" y="193" text-anchor="middle" font-size="11.5" fill="#5b6478">on my home network,</text>
  <text x="792" y="208" text-anchor="middle" font-size="11.5" fill="#5b6478">a host in plugin.json</text>

  <!-- blocked -->
  <line x1="612" y1="250" x2="700" y2="300" stroke="#c24a4a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <g stroke="#c24a4a" stroke-width="2.4" stroke-linecap="round">
    <line x1="649" y1="267" x2="663" y2="281"/>
    <line x1="663" y1="267" x2="649" y2="281"/>
  </g>
  <rect x="704" y="268" width="176" height="76" rx="10" fill="#fdeeee" stroke="#e5b3b3" stroke-width="1.5"/>
  <text x="792" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#1e2433">Anywhere else</text>
  <text x="792" y="311" text-anchor="middle" font-size="11.5" fill="#5b6478">blocked, web fonts</text>
  <text x="792" y="326" text-anchor="middle" font-size="11.5" fill="#5b6478">and scripts included</text>

  <!-- opt-in -->
  <text x="24" y="430" font-size="13" font-weight="700" fill="#1f7a55">Off until I turn it on.</text>
  <text x="182" y="430" font-size="12" fill="#5b6478">Cadabra comes with no plugin and the agent key off. For words to leave, I do all three:</text>

  <rect x="24" y="444" width="260" height="56" rx="8" fill="#eaf7f1" stroke="#9fd6bd" stroke-width="1.5"/>
  <text x="154" y="467" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">1. Put a plugin's folder</text>
  <text x="154" y="486" text-anchor="middle" font-size="11.5" fill="#5b6478">in the plugins folder</text>
  <line x1="286" y1="472" x2="316" y2="472" stroke="#1f9d6b" stroke-width="1.6" marker-end="url(#arrG)"/>

  <rect x="320" y="444" width="260" height="56" rx="8" fill="#eaf7f1" stroke="#9fd6bd" stroke-width="1.5"/>
  <text x="450" y="467" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">2. Pick it in Settings</text>
  <text x="450" y="486" text-anchor="middle" font-size="11.5" fill="#5b6478">its plugin.json lists where it can reach</text>
  <line x1="582" y1="472" x2="612" y2="472" stroke="#1f9d6b" stroke-width="1.6" marker-end="url(#arrG)"/>

  <rect x="616" y="444" width="264" height="56" rx="8" fill="#eaf7f1" stroke="#9fd6bd" stroke-width="1.5"/>
  <text x="748" y="467" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">3. Give the agent key a key</text>
  <text x="748" y="486" text-anchor="middle" font-size="11.5" fill="#5b6478">only words said while holding it go out</text>
</svg>
