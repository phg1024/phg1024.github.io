<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">GPU reads of pinned host memory depend on free memory at allocation time</title>
<desc id="d">Four panels: rows are the GPU copy test and the GPU kernel read test, columns are allocation with about 60 GB free and allocation with about 11 GB free requiring page reclaim. With memory free, all thirteen 2 GiB chunks read at 27 and 24 GB/s. Under reclaim only the first three chunks stay fast; the rest fall to 16 to 22 and 14 to 20. The CPU reference line at 30.5 GB/s is unchanged in every panel.</desc>
<rect width="960" height="640" fill="#f7f8fb"/>
<text x="480.0" y="36.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1e2433">Same pages, two readers</text>
<text x="480.0" y="58.0" text-anchor="middle" font-size="12.5" fill="#5b6478">13 &#215; 2 GiB pinned host buffers &#183; only the GPU&#8217;s view of the pages changes</text>
<text x="280.0" y="140.0" text-anchor="middle" font-size="13" font-weight="600" fill="#5b6478">Allocated with ~60 GB free (page cache dropped)</text>
<text x="750.0" y="140.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Allocated with ~11 GB free (reclaim required)</text>
<text x="22.0" y="148.0" font-size="13" font-weight="600" fill="#1e2433">GPU copy</text>
<text x="22.0" y="370.0" font-size="13" font-weight="600" fill="#1e2433">GPU kernel read</text>
