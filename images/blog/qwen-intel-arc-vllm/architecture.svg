<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">Qwen inference server architecture</title>
  <desc id="desc">An API client sends chat requests to the vLLM XPU server. The server coordinates a Qwen INT4 target model and a DFlash2 draft model. Both models use one Intel Arc Pro B70 GPU with 32 GB of memory. The draft proposes tokens and the target verifies them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; text-anchor: middle; fill: #172334; }
      .heading { font-size: 24px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 650; }
      .detail { font-size: 16px; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .box { stroke-width: 1.5; rx: 14; }
    </style>
  </defs>
  <rect width="960" height="660" rx="20" fill="#f8fafc"/>
  <text x="480" y="43" class="heading">Qwen on a single Intel GPU</text>
  <rect x="335" y="66" width="290" height="72" class="box" fill="#ffffff" stroke="#94a3b8"/>
  <text x="480" y="97" class="label">API client</text>
  <text x="480" y="122" class="detail">Messages and tool definitions</text>
  <path d="M 480 138 V 208" class="edge" marker-start="url(#arrow)"/>
  <rect x="498" y="155" width="230" height="28" rx="6" fill="#f8fafc"/>
  <text x="611" y="175" class="detail">OpenAI-compatible API</text>
  <rect x="45" y="193" width="870" height="432" rx="18" fill="#eef2f7" stroke="#cbd5e1" stroke-dasharray="7 5"/>
  <text x="139" y="222" class="detail">Inference host</text>
  <rect x="280" y="208" width="400" height="84" class="box" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="480" y="242" class="label">vLLM · XPU backend</text>
  <text x="480" y="269" class="detail">Scheduling, prefix caching, structured output</text>
  <path d="M 390 292 V 317 H 245 V 342" class="edge"/>
  <path d="M 570 292 V 317 H 715 V 342" class="edge"/>
  <rect x="80" y="342" width="330" height="105" class="box" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="245" y="375" class="label">Qwen3.6-35B-A3B</text>
  <text x="245" y="402" class="detail">INT4 target · BF16 compute</text>
  <text x="245" y="429" class="detail">Verifies draft proposals</text>
  <rect x="550" y="342" width="330" height="105" class="box" fill="#ccfbf1" stroke="#2dd4bf"/>
  <text x="715" y="375" class="label">DFlash2 draft model</text>
  <text x="715" y="402" class="detail">3 speculative tokens per step</text>
  <text x="715" y="429" class="detail">FP8 draft KV cache</text>
  <path d="M 550 394 H 410" class="edge"/>
  <text x="480" y="381" class="detail">Proposals</text>
  <path d="M 245 447 V 484 H 370 V 521" class="edge"/>
  <path d="M 715 447 V 484 H 590 V 521" class="edge"/>
  <text x="480" y="507" class="detail">Shared device memory and execution</text>
  <rect x="235" y="521" width="490" height="82" class="box" fill="#172334" stroke="#172334"/>
  <text x="480" y="555" class="label" style="fill:#ffffff">Intel Arc Pro B70 · 32 GB</text>
  <text x="480" y="582" class="detail" style="fill:#cbd5e1">Target + draft weights, caches, and runtime buffers</text>
</svg>
