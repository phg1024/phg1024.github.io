<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" width="900" height="544" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#2f6fd0"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#1f9d6b"/></marker>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#6b4fd0"/></marker>
  </defs>

  <rect width="900" height="544" fill="#f7f8fb"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1e2433">What "close the door" actually does</text>
  <text x="450" y="53" text-anchor="middle" font-size="12.5" fill="#5b6478">One command request, one pulse, and then the only news is whatever the next poll reads</text>

  <!-- lifeline headers -->
  <rect x="56" y="70" width="150" height="42" rx="9" fill="#ffffff" stroke="#c9d2e3" stroke-width="1.5"/>
  <text x="131" y="96" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e2433">Apple Home app</text>
  <rect x="256" y="70" width="160" height="42" rx="9" fill="#eef3fb" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="336" y="96" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e2433">Plugin</text>
  <rect x="460" y="70" width="160" height="42" rx="9" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="540" y="96" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e2433">Relay ESP</text>
  <rect x="666" y="70" width="160" height="42" rx="9" fill="#ffffff" stroke="#1f9d6b" stroke-width="1.5"/>
  <text x="746" y="96" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e2433">Sensor ESP</text>

  <g stroke="#c9d2e3" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="131" y1="112" x2="131" y2="500"/><line x1="336" y1="112" x2="336" y2="500"/>
    <line x1="540" y1="112" x2="540" y2="500"/><line x1="746" y1="112" x2="746" y2="500"/>
  </g>

  <!-- 1 -->
  <line x1="131" y1="148" x2="336" y2="148" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#a1)"/>
  <text x="139" y="141" font-size="11.5" fill="#243049">SET TargetDoorState = CLOSED</text>

  <!-- 2 -->
  <line x1="336" y1="184" x2="540" y2="184" stroke="#2f6fd0" stroke-width="1.8" marker-end="url(#a1)"/>
  <text x="344" y="177" font-size="11.5" fill="#243049">GET /off</text>

  <!-- 3 self -->
  <rect x="556" y="200" width="184" height="34" rx="7" fill="#f2f4f8" stroke="#c9d2e3" stroke-width="1.2"/>
  <text x="648" y="221" text-anchor="middle" font-size="11" fill="#243049">reply, then pulse D2 for 1 s</text>

  <!-- 4 -->
  <line x1="540" y1="254" x2="336" y2="254" stroke="#6b4fd0" stroke-width="1.8" marker-end="url(#a4)"/>
  <text x="344" y="247" font-size="11.5" fill="#243049">200 OK "Closing"</text>

  <!-- door travel band -->
  <rect x="440" y="272" width="420" height="74" rx="9" fill="#eef6f1" stroke="#1f9d6b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="650" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="#146b48">the door physically travels for 8–12 s</text>
  <text x="650" y="323" text-anchor="middle" font-size="11" fill="#146b48">the reed switch changes at the end of the run · nothing is sent to HomeKit</text>

  <!-- 5 -->
  <line x1="336" y1="376" x2="746" y2="376" stroke="#1f9d6b" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="344" y="369" font-size="11.5" fill="#243049">GET / — next scheduled poll (within 5 s)</text>

  <!-- 6 -->
  <line x1="746" y1="416" x2="336" y2="416" stroke="#6b4fd0" stroke-width="1.8" marker-end="url(#a4)"/>
  <text x="344" y="409" font-size="11.5" fill="#243049">"closed"</text>

  <!-- 7 -->
  <line x1="336" y1="456" x2="131" y2="456" stroke="#1f9d6b" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="139" y="449" font-size="11.5" fill="#1f9d6b">updateValue(CLOSED)</text>

  <text x="450" y="528" text-anchor="middle" font-size="11.5" fill="#5b6478">A command is one request that returns as soon as the pulse is done — the sensor is the only evidence of what happened.</text>
</svg>
