<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">A 27B model on one 32 GB Arc Pro B70: decode holds up, capacity and prefill do not</title>
<desc id="d">Left panel: decode rate in tokens per second against context from 64K to 220K for the target alone and with a DFlash2 drafter. Target only falls from 26.8 to 19.7. The drafter gives 54.9 at 64K but only 24.1 at 220K, and the BF16 drafter cannot be loaded past about 156.8K. Right panel: output tokens needed to pay back the drafter&#8217;s extra time to first token, rising from 43 at 64K to 2,361 at 220K.</desc>
<rect width="960" height="470" fill="#f7f8fb"/>
<text x="480.0" y="36.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1e2433">Decode holds up. Everything else does not.</text>
<text x="480.0" y="58.0" text-anchor="middle" font-size="12.5" fill="#5b6478">Qwen 3.8 27B on one 32 GB Arc Pro B70 &#183; vLLM, W4A16, FP8 KV, one sequence, no prefix cache</text>
