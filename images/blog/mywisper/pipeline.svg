<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#3b4457"/>
    </marker>
    <marker id="arr-net" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#c77a1f"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#f7f8fb"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1e2433">From key press to text, in MyWisper 1.1</text>
  <text x="450" y="55" text-anchor="middle" font-size="12.5" fill="#5b6478">Yellow: the speech model, unchanged. Green and blue: new this week. Right: one passage on its way through.</text>

  <!-- 1: audio -->
  <rect x="60" y="84" width="460" height="56" rx="8" fill="#ffffff" stroke="#c9d2e3" stroke-width="1.5"/>
  <text x="290" y="107" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e2433">Hold the key and talk</text>
  <text x="290" y="126" text-anchor="middle" font-size="11.5" fill="#5b6478">16 kHz audio, kept in memory only</text>
  <line x1="290" y1="140" x2="290" y2="160" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 2: SenseVoice -->
  <rect x="60" y="164" width="460" height="56" rx="8" fill="#fff8e6" stroke="#e0c675" stroke-width="1.5"/>
  <text x="290" y="187" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e2433">SenseVoice-Small</text>
  <text x="290" y="206" text-anchor="middle" font-size="11.5" fill="#5b6478">sound to text, 30–100 ms · knows sounds, not meaning</text>
  <line x1="290" y1="220" x2="290" y2="240" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 3: spelling repair -->
  <rect x="60" y="244" width="460" height="56" rx="8" fill="#eaf6ee" stroke="#5aa872" stroke-width="1.5"/>
  <text x="290" y="267" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e2433">Spelling repair (1.0.1)</text>
  <text x="290" y="286" text-anchor="middle" font-size="11.5" fill="#5b6478">repeated word endings, checked with the Mac's spell checker</text>
  <line x1="290" y1="300" x2="290" y2="320" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 4: correction -->
  <rect x="60" y="324" width="460" height="78" rx="8" fill="#eaf1fc" stroke="#2f6fd6" stroke-width="1.5"/>
  <text x="290" y="348" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e2433">Correction (1.1.0, experimental, off by default)</text>
  <text x="290" y="367" text-anchor="middle" font-size="11.5" fill="#5b6478">Qwen3.5 35B-A3B or 4B, inside the app with llama.cpp on the GPU</text>
  <text x="290" y="385" text-anchor="middle" font-size="11.5" fill="#5b6478">reads the text plus my vocabulary list · 0.2–0.7 s</text>
  <line x1="290" y1="402" x2="290" y2="422" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- bypass: correction skipped -->
  <path d="M60,272 H34 V454 H56" fill="none" stroke="#8a93a6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="24" y="363" text-anchor="middle" font-size="11" fill="#5b6478" transform="rotate(-90 24 363)">off, over 8 s, or wrong length</text>

  <!-- 5: paste -->
  <rect x="60" y="426" width="460" height="56" rx="8" fill="#ffffff" stroke="#c9d2e3" stroke-width="1.5"/>
  <text x="290" y="449" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e2433">Paste at the cursor</text>
  <text x="290" y="468" text-anchor="middle" font-size="11.5" fill="#5b6478">clipboard + ⌘V, kept off Universal Clipboard</text>
  <line x1="290" y1="482" x2="290" y2="502" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 6: save recordings -->
  <rect x="60" y="506" width="460" height="56" rx="8" fill="#ffffff" stroke="#8a93a6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="290" y="529" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e2433">Save recordings (optional, off by default)</text>
  <text x="290" y="548" text-anchor="middle" font-size="11.5" fill="#5b6478">audio plus recognized and corrected text, readable only by me</text>

  <!-- example passage -->
  <text x="576" y="190" font-size="11" fill="#5b6478">SenseVoice heard</text>
  <rect x="560" y="198" width="310" height="34" rx="6" fill="#ffffff" stroke="#c9d2e3"/>
  <text x="576" y="220" font-size="13" fill="#1e2433">想去<tspan fill="#a33a36" font-weight="600">大道</tspan> … 好像叫<tspan fill="#a33a36" font-weight="600">kiowway</tspan></text>

  <text x="576" y="268" font-size="11" fill="#5b6478">elsewhere, the kind of thing this fixes</text>
  <rect x="560" y="276" width="310" height="34" rx="6" fill="#ffffff" stroke="#c9d2e3"/>
  <text x="576" y="298" font-size="13" fill="#1e2433"><tspan fill="#a33a36">pendingending</tspan> → <tspan fill="#2c7a46" font-weight="600">pending</tspan></text>

  <text x="576" y="350" font-size="11" fill="#5b6478">after correction</text>
  <rect x="560" y="358" width="310" height="34" rx="6" fill="#ffffff" stroke="#c9d2e3"/>
  <text x="576" y="380" font-size="13" fill="#1e2433">想去<tspan fill="#2c7a46" font-weight="600">大岛</tspan> … 好像叫<tspan fill="#2c7a46" font-weight="600">Kilauea</tspan></text>

  <!-- model download, the only network step -->
  <rect x="560" y="430" width="310" height="76" rx="8" fill="#fdf3e6" stroke="#c77a1f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="715" y="453" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Model download, once</text>
  <text x="715" y="472" text-anchor="middle" font-size="11.5" fill="#5b6478">from Hugging Face, only after I click</text>
  <text x="715" y="490" text-anchor="middle" font-size="11.5" fill="#5b6478">pinned version, SHA-256 checked</text>
  <path d="M560,452 H540 V380 H524" fill="none" stroke="#c77a1f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-net)"/>

  <text x="450" y="596" text-anchor="middle" font-size="12" fill="#5b6478">Nothing on the left touches the network. The orange download is the only network code, and it runs only when asked.</text>
</svg>
