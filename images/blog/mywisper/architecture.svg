<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#3b4457"/>
    </marker>
  </defs>

  <rect width="900" height="650" fill="#f7f8fb"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1e2433">Same model, different app around it</text>
  <text x="450" y="55" text-anchor="middle" font-size="12.5" fill="#5b6478">Red: what broke in the first version. Yellow: the speech model, unchanged.</text>

  <!-- column headers -->
  <text x="229" y="88" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e2433">First version: Python (Gemini)</text>
  <text x="671" y="88" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e2433">Second version: native Swift app</text>
  <line x1="450" y1="72" x2="450" y2="600" stroke="#c9d2e3" stroke-width="1.2"/>

  <!-- ===== left column: Python ===== -->
  <rect x="39" y="104" width="380" height="52" rx="8" fill="#fdeeee" stroke="#d9534f" stroke-width="1.5"/>
  <text x="229" y="125" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Hotkey listener (pynput)</text>
  <text x="229" y="143" text-anchor="middle" font-size="11" fill="#a33a36">keeps its own "recording?" flag, which drifts out of sync</text>

  <rect x="39" y="176" width="380" height="52" rx="8" fill="#fdeeee" stroke="#d9534f" stroke-width="1.5"/>
  <text x="229" y="197" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Controller</text>
  <text x="229" y="215" text-anchor="middle" font-size="11" fill="#a33a36">locked while transcribing: anything said then is lost</text>

  <rect x="39" y="248" width="380" height="52" rx="8" fill="#ffffff" stroke="#c9d2e3" stroke-width="1.5"/>
  <text x="229" y="269" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Microphone (sounddevice)</text>
  <text x="229" y="287" text-anchor="middle" font-size="11" fill="#5b6478">16 kHz audio</text>

  <rect x="39" y="320" width="380" height="52" rx="8" fill="#fff8e6" stroke="#e0c675" stroke-width="1.5"/>
  <text x="229" y="341" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">SenseVoice-Small</text>
  <text x="229" y="359" text-anchor="middle" font-size="11" fill="#5b6478">sherpa-onnx, Python bindings · 30–50 ms a sentence</text>

  <rect x="39" y="392" width="380" height="52" rx="8" fill="#ffffff" stroke="#c9d2e3" stroke-width="1.5"/>
  <text x="229" y="413" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Paste: pbcopy + ⌘V via AppleScript</text>
  <text x="229" y="431" text-anchor="middle" font-size="11" fill="#5b6478">overwrites the clipboard</text>

  <line x1="229" y1="156" x2="229" y2="172" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="229" y1="228" x2="229" y2="244" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="229" y1="300" x2="229" y2="316" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="229" y1="372" x2="229" y2="388" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== right column: native ===== -->
  <rect x="481" y="104" width="380" height="52" rx="8" fill="#ffffff" stroke="#c9d2e3" stroke-width="1.5"/>
  <text x="671" y="125" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Hotkey: system event tap</text>
  <text x="671" y="143" text-anchor="middle" font-size="11" fill="#5b6478">needs Accessibility; set up again as soon as it's granted</text>

  <rect x="481" y="176" width="380" height="52" rx="8" fill="#ffffff" stroke="#c9d2e3" stroke-width="1.5"/>
  <text x="671" y="197" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">One state machine</text>
  <text x="671" y="215" text-anchor="middle" font-size="11" fill="#5b6478">the only place that knows whether it's recording</text>

  <rect x="481" y="248" width="380" height="52" rx="8" fill="#ffffff" stroke="#c9d2e3" stroke-width="1.5"/>
  <text x="671" y="269" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Microphone (AVAudioEngine)</text>
  <text x="671" y="287" text-anchor="middle" font-size="11" fill="#5b6478">converted to 16 kHz mono, kept only in memory</text>

  <rect x="481" y="320" width="380" height="52" rx="8" fill="#fff8e6" stroke="#e0c675" stroke-width="1.5"/>
  <text x="671" y="341" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">SenseVoice-Small</text>
  <text x="671" y="359" text-anchor="middle" font-size="11" fill="#5b6478">sherpa-onnx C library, model inside the app · 50 ms for 5 s</text>

  <rect x="481" y="392" width="380" height="52" rx="8" fill="#ffffff" stroke="#c9d2e3" stroke-width="1.5"/>
  <text x="671" y="413" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Paste: clipboard + ⌘V</text>
  <text x="671" y="431" text-anchor="middle" font-size="11" fill="#5b6478">this Mac only (no Universal Clipboard), old clipboard put back</text>

  <line x1="671" y1="156" x2="671" y2="172" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="671" y1="228" x2="671" y2="244" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="671" y1="300" x2="671" y2="316" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="671" y1="372" x2="671" y2="388" stroke="#3b4457" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- around it -->
  <line x1="24" y1="466" x2="876" y2="466" stroke="#9fb0d0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="404" y="456" width="92" height="20" fill="#f7f8fb"/>
  <text x="450" y="470" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f4a7a">around it</text>

  <rect x="39" y="486" width="380" height="52" rx="8" fill="#fdeeee" stroke="#d9534f" stroke-width="1.5"/>
  <text x="229" y="507" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Menu bar (rumps)</text>
  <text x="229" y="525" text-anchor="middle" font-size="11" fill="#a33a36">crashes at launch, falls back to a terminal window</text>

  <rect x="39" y="550" width="380" height="52" rx="8" fill="#fdeeee" stroke="#d9534f" stroke-width="1.5"/>
  <text x="229" y="571" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">HTTP API on localhost</text>
  <text x="229" y="589" text-anchor="middle" font-size="11" fill="#a33a36">no password: any web page can read history or start the mic</text>

  <rect x="481" y="486" width="380" height="52" rx="8" fill="#ffffff" stroke="#c9d2e3" stroke-width="1.5"/>
  <text x="671" y="507" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">Menu bar popup + recording bar (SwiftUI)</text>
  <text x="671" y="525" text-anchor="middle" font-size="11" fill="#5b6478">settings, searchable history; the bar never takes focus</text>

  <rect x="481" y="550" width="380" height="52" rx="8" fill="#e9f7ef" stroke="#1f9d6b" stroke-width="1.5"/>
  <text x="671" y="571" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2433">No network code at all</text>
  <text x="671" y="589" text-anchor="middle" font-size="11" fill="#1a7a54">no API; checked: no network imports, no connections</text>

  <text x="450" y="634" text-anchor="middle" font-size="11.5" fill="#5b6478">Both: hold a key, talk, let go; the text is pasted at the cursor.</text>
</svg>
